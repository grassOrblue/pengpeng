<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>门店服务</title><style>body{font:16px system-ui;background:#f6f5f1;color:#262626;margin:0}main{max-width:580px;margin:auto;padding:24px}section{background:white;border-radius:16px;padding:20px;margin:14px 0}h1{font-size:24px}p{line-height:1.6;color:#666}button,a{display:block;box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border:0;border-radius:9px;background:#ffd348;color:#222;text-align:center;text-decoration:none;font-size:16px}textarea{box-sizing:border-box;width:100%;height:110px;padding:10px}img{width:90px;height:90px;object-fit:cover;margin:4px;border-radius:8px}.secondary{background:#eee}.hint{font-size:13px}</style></head><body><main><h1 id="name">正在加载门店…</h1><p id="address"></p><section><h2>选择平台</h2><p>请确认门店和地址，进入平台后自行收藏、打卡或评价。</p><div id="platforms"></div></section><section><h2>记录你的真实体验</h2><p class="hint">写下你的感受，复制后可在目标平台粘贴并修改。</p><textarea id="review" placeholder="例如：今天体验了什么？你的感受如何？"></textarea><button class="secondary" id="copy">复制文字</button><p id="copy-status" role="status"></p></section><section><h2>商家图片</h2><p class="hint">图片仅供选择参考；也可以在目标平台选择自己的照片。长按图片可保存；图片不会自动上传。</p><div id="images"></div><label>选择自己的照片（仅在本机预览）<input id="local-photos" type="file" accept="image/*" multiple></label><div id="local-preview"></div><button class="secondary" id="random">随机换一组</button></section></main><script src="/tap.js"></script></body></html>
